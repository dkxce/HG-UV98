name: Auto Translate Markdown

on:
  push:
    branches:
      - master
    paths:
      - 'fw_disasm/scripts/replace_splash.md'
      - 'fw_disasm/pinpatch/README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Translator
        uses: dkxce/md-auto-translator@main
        with:
          translate_paths: |
            fw_disasm/scripts/replace_splash.md
            fw_disasm/pinpatch/README.md
          convert_skip: '**'
